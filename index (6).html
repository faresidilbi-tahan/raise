<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🖕</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #1b1b1f; overflow: hidden; }
  svg {
    width: min(70vw, 80vh);
    height: auto;
    animation: bob 2.8s ease-in-out infinite;
    transform-origin: 50% 95%;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-12px) rotate(2deg); }
  }
  .mid {
    transform-origin: 150px 230px;
    animation: rise 1.3s cubic-bezier(.5,-.3,.3,1.25) forwards;
  }
  @keyframes rise {
    0%, 35% { transform: scaleY(0.25); }
    100%    { transform: scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    svg, .mid { animation: none; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" aria-label="Middle finger">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0bf98"/>
      <stop offset="1" stop-color="#d9a075"/>
    </linearGradient>
  </defs>

  <!-- sleeve -->
  <path d="M78 360 Q78 340 98 340 H202 Q222 340 222 360 V420 H78 Z" fill="#33333b"/>
  <!-- wrist -->
  <path d="M96 300 H204 Q212 300 212 310 V345 H88 V310 Q88 300 96 300 Z" fill="url(#skin)"/>

  <!-- middle finger (behind fist) -->
  <g class="mid">
    <path d="M131 232 V70 Q131 42 150 42 Q169 42 169 70 V232 Z" fill="url(#skin)" stroke="#c48d66" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- nail -->
    <path d="M139 72 Q139 54 150 54 Q161 54 161 72 Q161 84 150 84 Q139 84 139 72 Z" fill="#f8d9c0" stroke="#d9a984" stroke-width="1.5"/>
    <!-- joint creases -->
    <path d="M135 120 Q150 126 165 120" fill="none" stroke="#c48d66" stroke-width="2" stroke-linecap="round"/>
    <path d="M135 170 Q150 176 165 170" fill="none" stroke="#c48d66" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- fist (back of hand + curled fingers) -->
  <path d="M74 240
           Q74 206 100 204
           L108 204 Q118 196 134 198
           L166 198 Q182 196 192 204
           L214 206 Q232 210 230 232
           L230 300 Q230 318 212 318
           L92 318 Q74 318 74 300 Z"
        fill="url(#skin)" stroke="#c48d66" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- curled index finger -->
  <path d="M84 238 Q84 212 106 212 Q128 212 128 238 V262 H84 Z" fill="url(#skin)" stroke="#c48d66" stroke-width="2.5"/>
  <path d="M92 262 Q106 250 122 262" fill="none" stroke="#c48d66" stroke-width="2" stroke-linecap="round"/>
  <!-- curled ring finger -->
  <path d="M172 236 Q172 210 194 210 Q216 210 216 236 V262 H172 Z" fill="url(#skin)" stroke="#c48d66" stroke-width="2.5"/>
  <path d="M180 262 Q194 250 210 262" fill="none" stroke="#c48d66" stroke-width="2" stroke-linecap="round"/>
  <!-- curled pinky -->
  <path d="M216 250 Q216 228 232 228 Q248 228 248 250 V272 H216 Z" fill="url(#skin)" stroke="#c48d66" stroke-width="2.5"/>
  <!-- knuckle of middle finger base -->
  <path d="M136 226 Q150 214 164 226" fill="none" stroke="#c48d66" stroke-width="2" stroke-linecap="round"/>

  <!-- thumb wrapped over the front -->
  <path d="M74 262 Q64 258 70 246 Q82 232 104 246 L156 270 Q172 278 166 290 Q160 300 146 294 L92 278 Q78 274 74 262 Z"
        fill="url(#skin)" stroke="#c48d66" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M142 282 Q150 274 158 282" fill="none" stroke="#c48d66" stroke-width="2" stroke-linecap="round"/>
</svg>
</body>
</html>
